name: Build Windows

# Construit Escale pour Windows sur une machine Windows dans le cloud, et produit :
#  - Escale-portable.exe : UN SEUL fichier autonome (au double-clic il déballe
#                          tout en temp puis lance l'app, et nettoie à la fermeture)
#  - Escale-windows.zip   : le dossier complet (exe + dll + data) — secours
# Se lance à chaque push sur main, ou manuellement (onglet Actions → Run workflow).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Activer le bureau Windows
        run: flutter config --enable-windows-desktop

      - name: Récupérer les dépendances
        run: flutter pub get

      - name: Compiler (release)
        run: flutter build windows --release

      - name: Localiser le dossier Release
        id: rel
        shell: pwsh
        run: |
          $release = Get-ChildItem -Path build/windows -Recurse -Directory -Filter Release |
            Where-Object { Test-Path (Join-Path $_.FullName 'Escale.exe') } |
            Select-Object -First 1
          if (-not $release) { throw "Dossier Release (contenant Escale.exe) introuvable." }
          Write-Host "Dossier trouvé : $($release.FullName)"
          "dir=$($release.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Empaqueter le dossier en .zip (secours)
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ steps.rel.outputs.dir }}\*" -DestinationPath "Escale-windows.zip" -Force

      - name: Installer NSIS
        run: choco install nsis -y --no-progress

      - name: Construire l'exe portable unique (NSIS)
        shell: pwsh
        run: |
          # 1) Rassembler le contenu du dossier Release dans un dossier fixe « payload ».
          New-Item -ItemType Directory -Force -Path payload | Out-Null
          Copy-Item -Path "${{ steps.rel.outputs.dir }}\*" -Destination payload -Recurse -Force

          # 2) Compiler le script NSIS (windows_portable.nsi) en un exe unique.
          $mk = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $mk)) { $mk = "makensis" }
          & $mk windows_portable.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis a échoué (code $LASTEXITCODE)." }
          if (-not (Test-Path "Escale-portable.exe")) { throw "Escale-portable.exe non généré." }
          Write-Host "Créé : Escale-portable.exe ($([math]::Round((Get-Item Escale-portable.exe).Length/1MB,1)) Mo)"

      - name: Publier l'exe portable
        uses: actions/upload-artifact@v4
        with:
          name: Escale-portable
          path: Escale-portable.exe
          if-no-files-found: error

      - name: Publier le dossier complet (secours)
        uses: actions/upload-artifact@v4
        with:
          name: Escale-windows
          path: Escale-windows.zip
          if-no-files-found: error
